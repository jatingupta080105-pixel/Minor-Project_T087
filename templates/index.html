<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Predictor</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container{
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            margin-bottom: 20px;
        }

        input{
            width: 250px;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            width: 270px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover{
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Diabetes Prediction</h1>

        <form action="/predict" method="post">

            <input name="Pregnancies" placeholder="Pregnancies" required><br>

            <input name="Glucose" placeholder="Glucose" required><br>

            <input name="BloodPressure" placeholder="Blood Pressure" required><br>

            <input name="SkinThickness" placeholder="Skin Thickness" required><br>

            <input name="Insulin" placeholder="Insulin" required><br>

            <input name="BMI" placeholder="BMI" required><br>

            <input name="DPF" placeholder="Diabetes Pedigree Function" required><br>

            <input name="Age" placeholder="Age" required><br><br>

            <button type="submit">Predict</button>

        </form>
    </div>

</body>
</html>
